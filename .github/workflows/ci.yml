name: quality-gate

on:
  push:
    branches: [dev/02-pet-booking, main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: unit tests
        run: go test ./... -count=1
      - name: coverage
        run: |
          go test ./... -coverprofile=coverage.out
          go tool cover -func=coverage.out
      - name: race detector
        run: go test -race ./... -count=1
