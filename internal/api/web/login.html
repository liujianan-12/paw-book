<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>paw-book 登录（模拟）</title>
<style>body{font-family:system-ui;max-width:560px;margin:40px auto;padding:0 16px}
input,button{font-size:15px;padding:6px 8px;margin:4px 0}pre{background:#f5f5f5;padding:8px;white-space:pre-wrap}</style>
</head>
<body>
<h2>paw-book 登录（模拟账号）</h2>
<p>预置账号：u1 / mgr / rec / srv / cs1，密码均为 123456。仅教学演示。</p>
<form id="f">
  <input id="account" placeholder="账号" value="u1" required>
  <input id="password" type="password" placeholder="密码" value="123456" required>
  <button>登录</button>
</form>
<pre id="out">未登录</pre>
<p>
  <a href="/user.html">用户页</a> ·
  <a href="/reception.html">前台页</a> ·
  <a href="/cs.html">客服页</a> ·
  <a href="/manager.html">店长页</a>
</p>
<script>
async function api(method, path, body) {
  const r = await fetch(path, {method, headers:{'Content-Type':'application/json'}, body: body?JSON.stringify(body):undefined});
  const j = await r.json();
  if (j.code !== 0) throw new Error((j.code||'ERROR') + ': ' + j.message);
  return j.data;
}
document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const out = document.getElementById('out');
  try {
    const role = document.getElementById('account').value.trim() === 'u1' ? 'user' : 'staff';
    const data = await api('POST','/api/auth/login',{account:document.getElementById('account').value,password:document.getElementById('password').value});
    out.textContent = '登录成功：' + data.name + '（' + data.role + '）\n' + (data.role==='user'?'请打开用户页':'请打开对应员工页');
  } catch (err) { out.textContent = '登录失败：' + err.message; }
};
</script>
</body>
</html>
