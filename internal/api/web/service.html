<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>服务履约</title>
<style>body{font-family:system-ui;max-width:720px;margin:24px auto;padding:0 16px}
input,button{font-size:15px;padding:6px 8px;margin:4px 0}pre{background:#f5f5f5;padding:8px;white-space:pre-wrap}</style></head>
<body>
<h2>服务人员：开始 / 完成</h2>
<p><a href="/login.html">切换账号（srv）</a></p>
<form id="f">
  <input id="rid" type="number" placeholder="预约 ID" required>
  <button id="startBtn" type="button">开始服务</button>
  <button id="doneBtn" type="button">完成服务</button>
</form>
<pre id="out">等待操作</pre>
<script src="/guard.js"></script>
<script>
const out = document.getElementById('out');
async function api(method, path) {
  const r = await fetch(path, {method, headers:{'Content-Type':'application/json'}});
  const j = await r.json();
  if (j.code !== 0) throw new Error(j.code + ': ' + j.message);
  return j.data;
}
async function act(kind) {
  const rid = document.getElementById('rid').value;
  try {
    const d = await api('POST', `/api/service/reservations/${rid}/${kind}`);
    out.textContent = kind === 'start'
      ? (d.alreadyDone ? '已开始（幂等）' : '已开始：' + d.startedAt)
      : (d.alreadyDone ? '已完成（幂等，不重复记收入）' : '已完成：' + d.completedAt);
  } catch (e) { out.textContent = '操作被拒绝：' + e.message; }
}
document.getElementById('startBtn').onclick = () => act('start');
document.getElementById('doneBtn').onclick = () => act('complete');
</script>
</body></html>
