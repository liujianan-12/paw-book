<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>前台核销</title>
<style>body{font-family:system-ui;max-width:720px;margin:24px auto;padding:0 16px}
input,button{font-size:15px;padding:6px 8px;margin:4px 0}pre{background:#f5f5f5;padding:8px;white-space:pre-wrap}</style></head>
<body>
<h2>前台：核销到店</h2>
<p><a href="/login.html">切换账号（rec）</a></p>
<form id="f">
  <input id="rid" type="number" placeholder="预约 ID" required>
  <button>核销</button>
</form>
<pre id="out">等待核销</pre>
<script>
async function api(method, path, body) {
  const r = await fetch(path, {method, headers:{'Content-Type':'application/json'}, body: body?JSON.stringify(body):undefined});
  const j = await r.json();
  if (j.code !== 0) throw new Error(j.code + ': ' + j.message);
  return j.data;
}
document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const out = document.getElementById('out');
  try {
    const d = await api('POST', `/api/reception/reservations/${document.getElementById('rid').value}/checkin`);
    out.textContent = d.alreadyDone ? '该预约已核销（幂等，未新增记录）' : ('核销成功：' + d.checkedInAt);
  } catch (err) { out.textContent = '核销被拒绝：' + err.message; }
};
</script>
</body></html>
