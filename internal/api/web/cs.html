<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>客服审核与退款</title>
<style>body{font-family:system-ui;max-width:980px;margin:24px auto;padding:0 16px}
table{border-collapse:collapse;width:100%;margin:8px 0}td,th{border:1px solid #ddd;padding:6px;font-size:13px}
button{padding:3px 8px;margin:1px}pre{background:#f5f5f5;padding:8px;white-space:pre-wrap}</style></head>
<body>
<h2>客服：临近取消审核与退款跟进</h2>
<p><a href="/login.html">切换账号（cs1）</a></p>
<h3>待审核取消申请</h3>
<table id="reqs"><thead><tr><th>ID</th><th>预约</th><th>宠物</th><th>时段</th><th>原因</th><th>操作</th></tr></thead><tbody></tbody></table>
<h3>退款单</h3>
<table id="refs"><thead><tr><th>ID</th><th>预约</th><th>金额</th><th>状态</th><th>重试次数</th><th>失败原因</th><th>操作</th></tr></thead><tbody></tbody></table>
<pre id="out">就绪</pre>
<script src="/guard.js"></script>
<script>
const out = document.getElementById('out');
async function api(method, path, body) {
  const r = await fetch(path, {method, headers:{'Content-Type':'application/json'}, body: body?JSON.stringify(body):undefined});
  const j = await r.json();
  if (j.code !== 0) throw new Error(j.code + ': ' + j.message);
  return j.data;
}
async function load(){
  try {
    const reqs = await api('GET','/api/cs/cancel-requests?status=PENDING');
    const tb = document.querySelector('#reqs tbody'); tb.innerHTML='';
    reqs.forEach(q => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${q.ID}</td><td>${q.ReservationID}</td><td>${q.PetName}</td><td>${q.SlotStart}</td><td>${q.Reason}</td>`;
      const td = document.createElement('td');
      for (const [label, act] of [['批准','approve'],['拒绝','reject']]) {
        const b = document.createElement('button'); b.textContent = label;
        b.onclick = async () => { try { await api('POST', `/api/cs/cancel-requests/${q.ID}/${act}`, {note: label+'：客服处理'}); out.textContent='已'+label; load(); } catch(e){ out.textContent=label+'失败：'+e.message; } };
        td.appendChild(b);
      }
      tr.appendChild(td); tb.appendChild(tr);
    });
    const refs = await api('GET','/api/cs/refunds?status=UNFINISHED');
    const rb = document.querySelector('#refs tbody'); rb.innerHTML='';
    refs.forEach(f => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${f.ID}</td><td>${f.ReservationID}</td><td>${f.AmountCents}</td><td>${f.Status}</td><td>${f.RetryCount}</td><td>${f.LastError||'-'}</td>`;
      const td = document.createElement('td');
      if (f.Status === 'FAILED' || f.Status === 'PENDING') {
        const b = document.createElement('button'); b.textContent='重试退款';
        b.onclick = async () => { try { await api('POST', `/api/cs/refunds/${f.ID}/retry`); out.textContent='已提交重试'; load(); } catch(e){ out.textContent='重试失败：'+e.message; } };
        td.appendChild(b);
      }
      tr.appendChild(td); rb.appendChild(tr);
    });
  } catch(e) { out.textContent = '加载失败：' + e.message; }
}
requireLogin('cs').then(s => { if (s) load(); });
</script>
</body></html>
