<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>用户预约页</title>
<style>body{font-family:system-ui;max-width:880px;margin:24px auto;padding:0 16px}
table{border-collapse:collapse;width:100%;margin:8px 0}td,th{border:1px solid #ddd;padding:6px;font-size:14px}
button{padding:4px 8px;margin:2px}pre{background:#f5f5f5;padding:8px;white-space:pre-wrap}</style></head>
<body>
<h2>宠物主人：时段与我的预约</h2>
<p><a href="/login.html">切换账号</a></p>
<h3>可约时段</h3>
<table id="slots"><thead><tr><th>ID</th><th>开始</th><th>结束</th><th>剩余</th><th>操作</th></tr></thead><tbody></tbody></table>
<label>宠物：<select id="pet"><option value="1">豆豆</option><option value="2">咪咪</option></select></label>
<h3>我的预约</h3>
<table id="mine"><thead><tr><th>ID</th><th>状态</th><th>金额(分)</th><th>退款</th><th>操作</th></tr></thead><tbody></tbody></table>
<pre id="out">就绪</pre>
<script>
const out = document.getElementById('out');
async function api(method, path, body) {
  const r = await fetch(path, {method, headers:{'Content-Type':'application/json'}, body: body?JSON.stringify(body):undefined});
  const j = await r.json();
  if (j.code !== 0) throw new Error(j.code + ': ' + j.message);
  return j.data;
}
function say(s){ out.textContent = s; }
async function loadSlots(){
  const t = document.querySelector('#slots tbody'); t.innerHTML='';
  try {
    const list = await api('GET','/api/slots');
    list.forEach(s => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${s.ID}</td><td>${s.StartAt}</td><td>${s.EndAt}</td><td>${s.Remaining}</td>`;
      const td = document.createElement('td');
      const b = document.createElement('button'); b.textContent='预约';
      b.onclick = async () => { try { say(JSON.stringify(await api('POST','/api/reservations',{slotId:s.ID, petId:Number(document.getElementById('pet').value)}))); loadMine(); } catch(e){ say('预约失败：'+e.message); } };
      td.appendChild(b); tr.appendChild(td); t.appendChild(tr);
    });
  } catch(e) { say('加载时段失败：'+e.message); }
}
async function loadMine(){
  const t = document.querySelector('#mine tbody'); t.innerHTML='';
  try {
    const list = await api('GET','/api/my/reservations');
    list.forEach(r => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${r.ID}</td><td>${r.Status}</td><td>${r.PriceCents}</td><td>${r.RefundStatus||'-'}</td>`;
      const td = document.createElement('td');
      if (r.Status === 'PENDING_PAYMENT') {
        const pay = document.createElement('button'); pay.textContent='去支付';
        pay.onclick = async () => { try { say('支付单：'+JSON.stringify(await api('POST',`/api/reservations/${r.ID}/pay`))+'\n（演示：需调用模拟渠道 /pay 并回调）'); } catch(e){ say('支付失败：'+e.message); } };
        td.appendChild(pay);
      }
      const cancel = document.createElement('button'); cancel.textContent='取消';
      cancel.onclick = async () => {
        try { say(JSON.stringify(await api('POST',`/api/reservations/${r.ID}/cancel`,{reason:'临时有事'}))); loadSlots(); loadMine(); }
        catch(e){ if (e.message.includes('CANCEL_REASON_REQUIRED')) { say('临近开始取消需填写原因，请用接口提交原因'); } else { say('取消失败：'+e.message); } }
      };
      td.appendChild(cancel); tr.appendChild(td); t.appendChild(tr);
    });
  } catch(e) { say('加载我的预约失败：'+e.message); }
}
loadSlots(); loadMine();
</script>
</body></html>
